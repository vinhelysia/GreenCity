name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          RENDER_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_BACKEND_URL secret is not set yet. Skipping."
            exit 0
          fi
          echo "Pinging Render backend health endpoint: $RENDER_URL/health"
          curl -s -f -m 15 "$RENDER_URL/health" || echo "Ping failed or timed out"
