# Render Blueprint for the GreenCity API (NestJS).
# Web (Next.js) deploys separately on Vercel; the DB is Supabase PostgreSQL+PostGIS.
#
# One-time before/after creating this service:
#   1. Create the service from this repo (Render reads this file).
#   2. Set DATABASE_URL to the Supabase Session-pooler URL (Dashboard → Environment).
#   3. Run migrations + seed ONCE against Supabase from your machine
#      (pnpm --filter api exec prisma migrate deploy; pnpm --filter api db:seed) —
#      this service does not migrate on deploy.
#   4. After Vercel gives the web a domain, set CORS_ORIGINS to it (exact origin,
#      no trailing slash) or every cookie-auth request returns 403 INVALID_ORIGIN.
#
# Operational note: if this service already existed before the PAYOS_*/
# PUBLIC_*_URL keys below were added to this file, do not assume a Blueprint
# sync/redeploy will prompt for or create them on Render's side — verify in
# the Render Dashboard → Environment that they are actually present after
# deploying, and add them by hand there if not. Leaving them unset is not a
# startup error (checkout just stays PAYMENT_NOT_CONFIGURED), so this is easy
# to miss silently.
services:
  - type: web
    name: greencity-api
    runtime: node
    plan: free
    region: singapore # closest free region to the Supabase Tokyo database
    rootDir: . # repo root — pnpm workspace install needs it, not apps/api
    # Explicit build so it does not depend on the install prepare hook:
    # shared package, Prisma client, then the Nest build.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @greencity/shared build &&
      pnpm --filter api exec prisma generate &&
      pnpm --filter api build
    startCommand: pnpm --filter api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Trust the first client IP that Render prepends to X-Forwarded-For.
      # Later header values are untrusted and ignored by the rate-limit tracker.
      - key: TRUST_PROXY
        value: "1"
      # PORT is injected by Render; main.ts prefers it over API_PORT.
      - key: DATABASE_URL
        sync: false # secret — set in the Render dashboard, never commit
      - key: CORS_ORIGINS
        sync: false # the Vercel web origin — set after the web deploy
      - key: DEMO_PASSWORD
        sync: false # if you re-seed from here; a public default is unsafe on a shared DB
      # Images must persist across restarts, which the ephemeral free disk cannot
      # do — use Supabase Storage. Create a private bucket "greencity-media" first.
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false # service_role key — secret
      - key: SUPABASE_STORAGE_BUCKET
        value: greencity-media
      # payOS buyer-pass checkout — entirely optional. Leaving any of these
      # unset only disables checkout (PAYMENT_NOT_CONFIGURED); it is never a
      # startup error. payOS publishes no sandbox, so there is no environment
      # switch: the only host is production and it is hard-coded in the source.
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false # secret — set in the Render dashboard, never commit
      - key: PAYOS_CHECKSUM_KEY
        sync: false # secret — signs and verifies every payment; never commit
      # PUBLIC_WEB_URL builds the payOS return link. PUBLIC_API_URL is not used
      # per request — it only tells you the webhook address to register with
      # payOS: <PUBLIC_API_URL>/payment-webhooks/payos
      # https:// required in production.
      - key: PUBLIC_API_URL
        sync: false # this service's own public URL, e.g. https://greencity-api.onrender.com
      - key: PUBLIC_WEB_URL
        sync: false # the Vercel web origin — set after the web deploy
      # Google Geocoding for the "Đóng góp" map pin → ward/district/city.
      # Optional: unset only disables the autofill, never a startup error.
      # Lives here and NOT in Vercel on purpose — a Geocoding key takes no
      # HTTP-referrer restriction, so a browser-exposed one is billable by
      # anyone. Restrict it to this service's egress IPs in Google Cloud.
      - key: GOOGLE_GEOCODING_API_KEY
        sync: false # secret — set in the Render dashboard, never commit
